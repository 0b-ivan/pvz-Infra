apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvz-backend
  labels:
    app.kubernetes.io/name: pvz-backend
    app.kubernetes.io/part-of: pvz
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pvz-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pvz-backend
        app.kubernetes.io/part-of: pvz
    spec:
      containers:
        - name: backend
          image: ghcr.io/0b-ivan/pvz-backend:unconfigured
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: pvz-backend-config
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvz-backend-data
