apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvz-game
  labels:
    app.kubernetes.io/name: pvz-game
    app.kubernetes.io/part-of: pvz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pvz-game
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pvz-game
        app.kubernetes.io/part-of: pvz
    spec:
      containers:
        - name: game
          image: ghcr.io/0b-ivan/pvz-game:unconfigured
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pvz-game-config
          volumeMounts:
            - name: basic-auth
              mountPath: /etc/nginx/auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: basic-auth
          secret:
            secretName: pvz-basic-auth
            items:
              - key: .htpasswd
                path: .htpasswd
