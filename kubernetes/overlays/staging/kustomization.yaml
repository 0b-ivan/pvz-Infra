apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pvz-staging

resources:
  - ../../base
  - namespace.yaml
  - game-config.yaml
  - backend-config.yaml
  - secrets/ghcr-pull.sops.yaml

images:
  - name: ghcr.io/0b-ivan/pvz-game
    newName: ghcr.io/0b-ivan/pvz-game
    digest: sha256:7883df9f9f36a0e75d3f3570197be9b0cb8f463ebaf85bf3f05c6d724616c1f2
  - name: ghcr.io/0b-ivan/pvz-backend
    newName: ghcr.io/0b-ivan/pvz-backend
    digest: sha256:81bb473de4ce31a2a2fdd34eb95f8e817fe47daea7a943eacb97371505bb5642

replicas:
  - name: pvz-game
    count: 1
  - name: pvz-backend
    count: 1

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
  # Restart the backend so it reads the enabled admin UI from its ConfigMap.
  - target:
      kind: Deployment
      name: pvz-backend
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          pvz.obivan.org/admin-ui: "enabled"
