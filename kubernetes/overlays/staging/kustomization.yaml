apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pvz-staging

resources:
  - ../../base
  - namespace.yaml
  - game-config.yaml
  - backend-config.yaml
  - secrets/ghcr-pull.sops.yaml

images:
  - name: ghcr.io/0b-ivan/pvz-game
    newName: ghcr.io/0b-ivan/pvz-game
    digest: sha256:ad652f80c6d7df441cdfcb298db328cfe67bc103ba794c60f10085c4d2af7cbd
  - name: ghcr.io/0b-ivan/pvz-backend
    newName: ghcr.io/0b-ivan/pvz-backend
    digest: sha256:81bb473de4ce31a2a2fdd34eb95f8e817fe47daea7a943eacb97371505bb5642

replicas:
  - name: pvz-game
    count: 1
  - name: pvz-backend
    count: 1

patches:
  - target:
      kind: Ingress
      name: pvz
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pvz-staging.obivan.org

  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
